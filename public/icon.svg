<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#698e75"/>
      <stop offset="100%" stop-color="#4d6f59"/>
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)"/>

  <!-- Vitruvian Circle (Proportion & Harmony) -->
  <circle cx="128" cy="130" r="88" fill="none" stroke="#fbf8f5" stroke-width="2.5" opacity="0.38"/>

  <!-- Vitruvian Square (Earth & Geometry) -->
  <rect x="52" y="54" width="152" height="152" fill="none" stroke="#fbf8f5" stroke-width="2" stroke-dasharray="6,4" opacity="0.25"/>

  <!-- Central Plumb / Symmetry Axis -->
  <line x1="128" y1="36" x2="128" y2="224" stroke="#e8a598" stroke-width="1.8" stroke-dasharray="4,4" opacity="0.75"/>

  <!-- Vitruvian Figure (Schematic Minimalism) -->
  <g stroke="#fbf8f5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="128" cy="68" r="13" fill="#fbf8f5" stroke-width="0"/>

    <!-- Spine / Torso -->
    <line x1="128" y1="82" x2="128" y2="146" stroke-width="4.5"/>

    <!-- Dual Arm Position 1: Outstretched horizontal (Touches square) -->
    <line x1="56" y1="98" x2="200" y2="98" stroke-width="3.5" opacity="0.95"/>

    <!-- Dual Arm Position 2: Raised angled (Touches upper circle) -->
    <line x1="128" y1="92" x2="68" y2="70" stroke-width="3" opacity="0.6"/>
    <line x1="128" y1="92" x2="188" y2="70" stroke-width="3" opacity="0.6"/>

    <!-- Dual Leg Position 1: Standing straight (Grounding) -->
    <line x1="128" y1="144" x2="114" y2="206" stroke-width="3.5" opacity="0.95"/>
    <line x1="128" y1="144" x2="142" y2="206" stroke-width="3.5" opacity="0.95"/>

    <!-- Dual Leg Position 2: Spread legs (Touches lower circle) -->
    <line x1="128" y1="144" x2="78" y2="192" stroke-width="3" opacity="0.6"/>
    <line x1="128" y1="144" x2="178" y2="192" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- Accent Pivot Points (Peach / Warm Sand) -->
  <!-- Crown / Alignment Pivot -->
  <circle cx="128" cy="46" r="4" fill="#e8a598"/>
  <!-- Navel / Biomechanical Core -->
  <circle cx="128" cy="130" r="3.5" fill="#e8a598"/>
</svg>
